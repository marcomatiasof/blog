<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ganhar dinheiro com IA">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3d9f"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3378f6"/>
      <stop offset="1" stop-color="#8ec0ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg5)"/>
  <!-- Barras de crescimento -->
  <g>
    <rect x="150" y="300" width="70" height="90" rx="8" fill="url(#bar)"/>
    <rect x="250" y="240" width="70" height="150" rx="8" fill="url(#bar)"/>
    <rect x="350" y="180" width="70" height="210" rx="8" fill="url(#bar)"/>
    <rect x="450" y="120" width="70" height="270" rx="8" fill="url(#bar)"/>
  </g>
  <!-- Seta -->
  <g stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 280 L285 220 L385 160 L560 80"/>
    <path d="M530 80 H560 V110"/>
  </g>
  <!-- Cifrão IA -->
  <g transform="translate(640,320)">
    <circle r="52" fill="#3378f6"/>
    <text x="0" y="18" text-anchor="middle" font-family="ui-sans-serif,system-ui,Arial" font-size="54" font-weight="800" fill="#ffffff">$</text>
  </g>
</svg>
